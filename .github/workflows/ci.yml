name: CI

# The source repo is private, so Actions minutes are metered (Windows counts
# double). Tests run locally in `npm run verify` before every release; run this
# workflow by hand from the Actions tab when a full CI pass is wanted.
on:
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: E2E tests (Windows only)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Package and verify installer (Windows only)
        if: runner.os == 'Windows'
        run: npm run package:verify
